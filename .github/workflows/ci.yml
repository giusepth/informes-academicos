name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the latest run per branch matters; cancel leftovers to free runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint src

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: E2E tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Build (Vite)
        run: npm run build
